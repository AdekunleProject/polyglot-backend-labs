server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /products/:id, /admin/orders)
    # aren't real files on disk — fall back to index.html so the app's own
    # router handles them instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built asset filenames (hash in the name), so these
    # are safe to cache aggressively — a new deploy gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
