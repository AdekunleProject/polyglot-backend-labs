apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: duka
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace REPLACE_OWNER, same as backend-deployment.yaml.
          # NOTE: VITE_API_URL is baked into this image at BUILD time
          # (see Dockerfile) — you cannot change which backend this
          # points at by editing this Deployment; you have to rebuild
          # the image with a different --build-arg VITE_API_URL.
          image: ghcr.io/REPLACE_OWNER/duka-storefront:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
