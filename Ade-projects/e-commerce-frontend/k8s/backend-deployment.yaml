apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: duka
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace REPLACE_OWNER with your GitHub username/org — this
          # matches the image the GitHub Actions workflow pushes to.
          image: ghcr.io/REPLACE_OWNER/ecommerce-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Matches the Dockerfile's HEALTHCHECK — a real, existing,
          # public GET endpoint, not a fabricated /health route.
          readinessProbe:
            httpGet:
              path: /products
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /products
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
