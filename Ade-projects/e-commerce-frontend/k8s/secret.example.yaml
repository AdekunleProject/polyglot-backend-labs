# TEMPLATE — do not apply this file as-is and never commit a real filled-in
# copy to git. Two ways to create the real secret:
#
# 1. Copy this file to secret.yaml, fill in real values, `kubectl apply -f`
#    it, then make sure secret.yaml is in .gitignore (k8s/secret.yaml is
#    already excluded — see .gitignore in this repo).
#
# 2. Or skip files entirely and create it imperatively, which never touches
#    disk:
#   kubectl create secret generic backend-secret -n duka \
#     --from-literal=MONGODB_URI='mongodb+srv://user:pass@cluster.mongodb.net/ecommerce' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=JWT_REFRESH_SECRET='...' \
#     --from-literal=PAYSTACK_SECRET_KEY='...' \
#     --from-literal=BANK_NAME='...' \
#     --from-literal=BANK_ACCOUNT_NAME='...' \
#     --from-literal=BANK_ACCOUNT_NUMBER='...' \
#     --from-literal=GOOGLE_CLIENT_ID='...' \
#     --from-literal=GOOGLE_CLIENT_SECRET='...'
#
# For anything beyond a small side project, look at Sealed Secrets or
# External Secrets Operator instead of plain k8s Secrets (which are only
# base64-encoded, not encrypted, at rest by default on most clusters).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: duka
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://user:pass@cluster.mongodb.net/ecommerce"
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  PAYSTACK_SECRET_KEY: "REPLACE_ME"
  BANK_NAME: "REPLACE_ME"
  BANK_ACCOUNT_NAME: "REPLACE_ME"
  BANK_ACCOUNT_NUMBER: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
