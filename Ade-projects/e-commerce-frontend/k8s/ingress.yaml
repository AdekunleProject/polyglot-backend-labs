# Assumes an nginx ingress controller is already installed on the cluster
# (ingress-nginx — install separately, it's not part of these manifests).
# Two hosts rather than path-based routing, because VITE_API_URL is baked
# into the frontend image at build time as one absolute URL — build the
# frontend with VITE_API_URL=https://api.example.com to match this.
#
# TLS: the commented block assumes cert-manager + a ClusterIssuer named
# letsencrypt-prod are already set up (also separate from these manifests).
# Uncomment once that exists; until then this serves plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duka-ingress
  namespace: duka
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - app.example.com
  #       - api.example.com
  #     secretName: duka-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
