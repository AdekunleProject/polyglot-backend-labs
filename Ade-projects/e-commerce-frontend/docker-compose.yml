# Local dev only — assumes this frontend and the backend repo sit as
# sibling folders, e.g.:
#   projects/
#     duka-storefront/   (this repo — docker-compose.yml lives here)
#     ecommerce-backend/
#
# If your backend folder has a different name/location, either rename it
# to match or set BACKEND_PATH in a .env file next to this compose file:
#   BACKEND_PATH=../my-backend-folder-name
#
# Run with:  docker compose up --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ${BACKEND_PATH:-../ecommerce-backend}
    restart: unless-stopped
    env_file:
      - ${BACKEND_PATH:-../ecommerce-backend}/.env
    environment:
      # Overrides whatever's in the backend's .env so it talks to the
      # `mongo` service above instead of a local/remote Mongo instance.
      MONGODB_URI: mongodb://mongo:27017/ecommerce
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      BASE_URL: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
