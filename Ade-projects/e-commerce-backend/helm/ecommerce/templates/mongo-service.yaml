apiVersion: v1
kind: Service
metadata:
  name: ecommerce-mongo
  labels:
    app.kubernetes.io/name: ecommerce-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ecommerce-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
