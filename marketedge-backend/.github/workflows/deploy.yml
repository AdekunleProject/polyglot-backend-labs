name: MarketEdge Free-Tier pnpm CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Mount pnpm environment caching strategy
    - name: Install pnpm Package Manager
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        
    - name: Install Dependencies & Run E2E Tests
      env:
        MONGODB_URI: mongodb://localhost:27017/marketedge-test
        JWT_SECRET: testing-secret-key
        PAYSTACK_SECRET_KEY: sk_test_mock
      run: |
        pnpm install --frozen-lockfile
        pnpm run test:e2e

    # 2. Securely drop build updates directly into your Free Tier AWS EC2
    - name: Deploy to AWS EC2 Instance via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/marketedge-backend || git clone https://github.com{{ github.repository }}.git /home/ubuntu/marketedge-backend
          cd /home/ubuntu/marketedge-backend
          
          git fetch --all
          git reset --hard origin/main
          
          # Redeploy using optimized docker execution hooks
          docker-compose down
          docker-compose up --build -d
