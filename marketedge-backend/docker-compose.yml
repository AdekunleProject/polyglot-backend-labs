version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: marketedge-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: marketedge-redis
    command: redis-server --requirepass clearsecretredispassword
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://root:secretpassword@mongodb:27017/marketedge?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PASSWORD=clearsecretredispassword
      - JWT_SECRET=super-secret-marketedge-key
      - PAYSTACK_SECRET_KEY=sk_test_marketedge_mock_secret_key_12345
      - SMTP_HOST=smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=mock_user
      - SMTP_PASS=mock_pass
    depends_on:
      - mongodb
      - redis

volumes:
  mongo-data:
  redis-data:
