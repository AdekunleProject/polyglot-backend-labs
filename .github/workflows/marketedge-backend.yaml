name: marketedge-backend

on:
  push:
    branches: [master]
    paths:
      - 'marketedge-backend/**'
      - '.github/workflows/marketedge-backend.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'marketedge-backend/**'
      - '.github/workflows/marketedge-backend.yaml'

permissions:
  contents: read

env:
  APP_DIR: marketedge-backend
  TRIVY_VERSION: 0.69.3

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/marketedge-backend" >> "$GITHUB_ENV"

      - name: Build test image
        run: docker build --target build -t marketedge-test "$APP_DIR"

      - name: Lint (reporting only for now)
        continue-on-error: true
        run: docker run --rm marketedge-test pnpm run lint

      - name: Type check
        run: docker run --rm marketedge-test pnpm exec tsc --noEmit

      - name: Unit tests
        run: docker run --rm marketedge-test pnpm test

      - name: Build production image
        run: docker build -t "$IMAGE:$GITHUB_SHA" "$APP_DIR"

      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Trivy scan (fail on fixable CRITICAL)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE:$GITHUB_SHA"

      - name: Smoke test (image starts, /health and /ready answer)
        run: |
          docker network create ci
          docker run -d --name mongo --network ci mongo:7
          docker run -d --name redis --network ci redis:7-alpine redis-server --requirepass ci-redis
          docker run -d --name api --network ci -p 3000:3000 \
            -e MONGODB_URI=mongodb://mongo:27017/marketedge \
            -e REDIS_HOST=redis -e REDIS_PASSWORD=ci-redis \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e PAYSTACK_SECRET_KEY=sk_test_ci \
            "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health && curl -fsS http://localhost:3000/ready; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Push image (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
