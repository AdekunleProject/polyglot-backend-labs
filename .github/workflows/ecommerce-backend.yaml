name: ecommerce-backend

on:
  push:
    branches: [master]
    paths:
      - 'Ade-projects/e-commerce-backend/**'
      - '.github/workflows/ecommerce-backend.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'Ade-projects/e-commerce-backend/**'
      - '.github/workflows/ecommerce-backend.yaml'

permissions:
  contents: read

env:
  APP_DIR: Ade-projects/e-commerce-backend
  TRIVY_VERSION: 0.69.3

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce-backend" >> "$GITHUB_ENV"

      - name: Build test image
        run: docker build --target build -t ecommerce-test "$APP_DIR"

      - name: Lint (reporting only for now)
        continue-on-error: true
        run: docker run --rm ecommerce-test pnpm exec eslint "{src,test}/**/*.ts"

      - name: Unit tests
        run: docker run --rm ecommerce-test pnpm test

      - name: Build production image
        run: docker build -t "$IMAGE:$GITHUB_SHA" "$APP_DIR"

      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Trivy scan (fail on fixable CRITICAL)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE:$GITHUB_SHA"

      - name: Smoke test (image starts and answers /health)
        run: |
          docker network create ci
          docker run -d --name mongo --network ci mongo:7
          docker run -d --name api --network ci -p 4000:4000 \
            -e MONGODB_URI=mongodb://mongo:27017/ecommerce \
            -e JWT_SECRET=ci -e JWT_REFRESH_SECRET=ci \
            -e JWT_EXPIRES_IN=15m -e JWT_REFRESH_EXPIRES_IN=7d \
            -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e GOOGLE_CALLBACK_URL=http://localhost/cb \
            -e PAYSTACK_SECRET_KEY=ci -e PAYSTACK_CALLBACK_URL=http://localhost/pay \
            -e FRONTEND_URL=http://localhost:5173 \
            -e AWS_REGION=eu-north-1 -e AWS_ACCESS_KEY_ID=ci \
            -e AWS_SECRET_ACCESS_KEY=ci -e AWS_S3_BUCKET=ci \
            "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Push image (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"