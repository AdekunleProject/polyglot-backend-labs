name: blog-api

on:
  push:
    branches: [master]
    paths:
      - 'blog-api/**'
      - '.github/workflows/blog-api.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'blog-api/**'
      - '.github/workflows/blog-api.yaml'

permissions:
  contents: read

env:
  APP_DIR: blog-api
  TRIVY_VERSION: 0.69.3

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blog-api" >> "$GITHUB_ENV"

      - name: Build test image
        run: docker build --target build -t blog-test "$APP_DIR"

      - name: Lint (reporting only for now)
        continue-on-error: true
        run: docker run --rm blog-test pnpm lint

      - name: Unit tests
        run: docker run --rm blog-test pnpm test

      - name: Integration tests (real PostgreSQL, real migrations)
        run: |
          docker run -d --name itpg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=blog_it \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec itpg pg_isready -U postgres -d blog_it && break
            sleep 2
          done
          docker run --rm --network host blog-test pnpm test:e2e

      - name: Build production image
        run: docker build -t "$IMAGE:$GITHUB_SHA" "$APP_DIR"

      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Trivy scan (fail on fixable CRITICAL)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE:$GITHUB_SHA"

      - name: Smoke test (image migrates, starts, answers /health and /ready)
        run: |
          docker network create ci
          docker run -d --name pg --network ci \
            -e POSTGRES_USER=blog -e POSTGRES_PASSWORD=ci-password -e POSTGRES_DB=blog \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U blog -d blog && break
            sleep 2
          done
          docker run -d --name api --network ci -p 3000:3000 \
            -e DB_HOST=pg -e DB_PORT=5432 -e DB_USER=blog -e DB_PASSWORD=ci-password -e DB_NAME=blog \
            -e RUN_MIGRATIONS=true \
            -e JWT_SECRET=ci-access-secret-0123456789abcdef0123 \
            "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health && curl -fsS http://localhost:3000/ready; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Push image (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
